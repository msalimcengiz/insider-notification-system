name: insider-notification-system

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: insider-notification-system:dev
  volumes:
    - ./:/var/www/html
  # Connection settings live in .env (created from .env.example on first
  # boot). They are deliberately NOT set here: real environment variables take
  # precedence over phpunit.xml, which would point the test suite at the
  # development database.
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      CONTAINER_ROLE: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f storage/framework/.container-ready && SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *php
    environment:
      CONTAINER_ROLE: horizon
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy
      mock-provider:
        condition: service_started

  scheduler:
    <<: *php
    environment:
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # Stand-in for the external provider (see docker/mock-provider/server.mjs).
  # Set NOTIFICATION_PROVIDER_URL in .env to use webhook.site instead.
  mock-provider:
    image: node:22-alpine
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./docker/mock-provider:/app:ro
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.05}
      MOCK_PERMANENT_FAILURE_RATE: ${MOCK_PERMANENT_FAILURE_RATE:-0.01}
    ports:
      - "${MOCK_PROVIDER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence: queued jobs survive a Redis restart. PostgreSQL remains
    # the source of truth; see the recovery sweeper for the full guarantee.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
