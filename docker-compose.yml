name: insider-notification-system

# OpenTelemetry (distributed tracing). These must be real environment
# variables: the SDK configures itself while Composer's autoloader loads,
# before Laravel reads .env. Values can be overridden from .env / the shell.
# OTEL_PHP_AUTOLOAD_ENABLED is set only for the processes that are traced
# (php-fpm via docker/php/www.conf, Horizon, the scheduler), so ad-hoc CLI
# commands such as `php artisan test` run without the SDK.
x-otel: &otel
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: insider-notification-system:dev
  volumes:
    - ./:/var/www/html
  # Connection settings live in .env (created from .env.example on first
  # boot). They are deliberately NOT set here: real environment variables take
  # precedence over phpunit.xml, which would point the test suite at the
  # development database.
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      <<: *otel
      CONTAINER_ROLE: app
      OTEL_SERVICE_NAME: notification-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f storage/framework/.container-ready && SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *php
    environment:
      <<: *otel
      CONTAINER_ROLE: horizon
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: notification-worker
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    environment:
      <<: *otel
      CONTAINER_ROLE: scheduler
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_SERVICE_NAME: notification-scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  # WebSocket server for real-time status updates.
  reverb:
    <<: *php
    environment:
      CONTAINER_ROLE: reverb
      OTEL_SDK_DISABLED: "true"
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "${REVERB_EXTERNAL_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy

  # Optional local stand-in for webhook.site, for load and failure testing
  # only (webhook.site's free tier limits requests). Not started by
  # `docker-compose up`; see README, "Load test" and "Failure scenarios".
  mock-provider:
    image: node:22-alpine
    profiles: ["mock", "loadtest"]
    command: ["node", "/app/server.mjs"]
    volumes:
      - ./docker/mock-provider:/app:ro
    environment:
      MOCK_FAILURE_RATE: ${MOCK_FAILURE_RATE:-0.05}
      MOCK_PERMANENT_FAILURE_RATE: ${MOCK_PERMANENT_FAILURE_RATE:-0.01}
    ports:
      - "${MOCK_PROVIDER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Load test (not started by `docker compose up`):
  #   docker compose --profile loadtest run --rm k6
  k6:
    image: grafana/k6:0.57.0
    profiles: ["loadtest"]
    command: ["run", "/scripts/load-test.js"]
    volumes:
      - ./tests/k6:/scripts:ro
    depends_on:
      - nginx
      - mock-provider

  # Trace backend and UI: http://localhost:16686 (receives OTLP on 4318).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence: queued jobs survive a Redis restart. PostgreSQL remains
    # the source of truth; see the recovery sweeper for the full guarantee.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
