name: insider-notification-system

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: insider-notification-system:dev
  volumes:
    - ./:/var/www/html
  environment: &php-env
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: notifications
    DB_USERNAME: postgres
    DB_PASSWORD: postgres
    REDIS_HOST: redis
  restart: unless-stopped

services:
  app:
    <<: *php
    environment:
      <<: *php-env
      CONTAINER_ROLE: app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f storage/framework/.container-ready && SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  horizon:
    <<: *php
    environment:
      <<: *php-env
      CONTAINER_ROLE: horizon
    command: ["php", "artisan", "horizon"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *php
    environment:
      <<: *php-env
      CONTAINER_ROLE: scheduler
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notifications"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # AOF persistence: queued jobs survive a Redis restart. PostgreSQL remains
    # the source of truth; see the recovery sweeper for the full guarantee.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
