[www]
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Used by the container health check (cgi-fcgi -connect).
ping.path = /fpm-ping
ping.response = pong

clear_env = no

; Distributed tracing for HTTP requests (the other OTEL_* settings come from
; the container environment). Not set container-wide, so CLI commands such as
; `php artisan test` run without the OpenTelemetry SDK.
; Quoted: unquoted `true` would be passed on as "1", which OpenTelemetry rejects.
env[OTEL_PHP_AUTOLOAD_ENABLED] = "true"
catch_workers_output = yes
decorate_workers_output = no
